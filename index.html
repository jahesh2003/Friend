<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Friendship Day - Kuchupuchu Rasmalai</title>
    <style>
        /* Reset margins and prevent unwanted scrollbars */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #222; /* Dark background to make the frame pop */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Keeps the frame perfectly contained in the window */
            font-family: sans-serif;
        }

        /* Container that perfectly shrinks/wraps around the responsive image */
        .scrapbook-container {
            position: relative;
            display: inline-block; 
            font-size: 0; /* Removes phantom bottom spacing caused by inline elements */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* 
           The new image dynamically scales. 
           It will never be taller or wider than the screen.
        */
        .frame-img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            display: block;
            z-index: 1;
        }

        /* The video wrapper positioned over the cutout of the new taller image */
        .video-wrapper {
            position: absolute;
            /* 
               Recalibrated for the new image.png dimensions.
               Absolute positioning relies on the tight container wrapping.
            */
            top: 39.8%; 
            left: 16.5%;
            width: 67%; 
            
            /* Forces a perfect 16:9 aspect ratio */
            aspect-ratio: 16 / 9; 
            z-index: 2; 
            
            background-color: #000;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* The video element itself */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures no black bars inside the 16:9 box */
            display: block;
            cursor: pointer;
        }

        /* Subtle interaction */
        .video-wrapper:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transition: box-shadow 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="scrapbook-container">
        <!-- Using the newly requested image file -->
        <img src="assets/img/image.png" alt="Happy Friendship Day Frame" class="frame-img">
        
        <!-- Video perfectly aligned in 16:9 ratio -->
        <div class="video-wrapper">
            <video id="friendship-video" src="assets/video/memory.mp4" loop playsinline></video>
        </div>
    </div>

    <script>
        // Simple JavaScript to handle play/pause on click
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('friendship-video');

            // Play or pause the video when clicked
            video.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // Attempt to auto-play gracefully
            setTimeout(() => {
                video.play().catch(error => {
                    console.log("Autoplay was prevented by the browser. User must click to play.");
                });
            }, 300);
        });
    </script>

</body>
</html>
